name: Unit Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

jobs:
  unit_test:
    name: unit_test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          check-latest: false
      - run: go version
      - run: |
          git apply tests/0001-diff-go-ethereum.patch
          make test
